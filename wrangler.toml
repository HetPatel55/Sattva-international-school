# Cloudflare Pages project (static site in dist/ + API in functions/).
# Locally, `npm run dev:full` simulates the database (D1) and photo storage (R2)
# in .wrangler/ — no Cloudflare account needed. The database_id is replaced
# with the real one at go-live.
name = "sattva-website"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "sattva"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sattva-media"
